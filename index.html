<html lang=pl>
<head>
  <title></title>
  <script src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <section class="stats">
        <div class="card">
            <h2>Użytkownicy</h2>
            <p id="htmlUserCount">test</p>
        </div>

        <div class="card">
            <h2>Posty</h2>
            <canvas id="htmlPostCount"></canvas>
        </div>

        <div class="card">
            <h2>Liczba komentarzy na post</h2>
            <canvas id="htmlShowCommentCount"></canvas>
            <p id="htmlCommentAverage">test</p>
        </div>

        <div class="card">
            <h2>Wykonane zadania</h2>
            <canvas id="htmlTodoTasks"></canvas>
        </div>
    </section>
</body>
</html>
